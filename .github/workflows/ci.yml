name: Build Wizard's Keep
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade platformio "esptool<5"
      - name: Build firmware
        run: pio run -e m5stack-core2
      - name: Merge firmware
        run: python tools/merge_bin.py --env m5stack-core2
      - name: Prepare Pages payload
        run: |
          mkdir -p site/firmware
          cp website/index.html site/index.html
          cp website/manifest.json site/manifest.json
          cp website/firmware/wizards-keep-merged.bin site/firmware/wizards-keep-merged.bin
          cp README.md site/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: wizards-keep-firmware
          path: website/firmware/wizards-keep-merged.bin
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
