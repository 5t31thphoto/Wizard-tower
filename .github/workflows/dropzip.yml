name: Ingest source ZIP
on:
  workflow_dispatch:
  push:
    paths:
      - "drop/*.zip"
permissions:
  contents: write
jobs:
  ingest:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand uploaded ZIP into repository root
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(drop/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No ZIP found in drop/"; exit 0
          fi
          mkdir -p .zip-staging
          for z in "${zips[@]}"; do
            unzip -oq "$z" -d .zip-staging
          done
          # ZIP payloads are expected to contain project-root files directly.
          cp -a .zip-staging/. .
          rm -rf .zip-staging
          rm -f drop/*.zip
      - name: Commit expanded project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Ingest source ZIP"
          git push
